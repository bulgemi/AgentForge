<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Space Obsidian Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="40%" stop-color="#0C101D" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- App Icon Rim Light (Directional Lighting: Top-Left Ice White to Bottom-Right Amber) -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="25%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="70%" stop-color="rgba(255, 46, 77, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 183, 3, 0.4)" />
    </linearGradient>

    <!-- Bold Flame Red Anvil Body (Balanced Rich Luminance & Depth) -->
    <linearGradient id="anvilRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="20%" stop-color="#F41834" />
      <stop offset="60%" stop-color="#C50F28" />
      <stop offset="100%" stop-color="#88081C" />
    </linearGradient>

    <!-- Anvil Top Face Plate Specular Highlight (Precision Machined Edge) -->
    <linearGradient id="anvilTopHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB3BF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FFD6DC" />
      <stop offset="100%" stop-color="#FF8596" />
    </linearGradient>

    <!-- Anvil Stroke Accent -->
    <linearGradient id="anvilBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD4" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FF4D6D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6E0515" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bold Electric Lightning Bolt Gradient (Hyper Gold & Vibrant Amber) -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#FFF566" />
      <stop offset="40%" stop-color="#FFBA08" />
      <stop offset="75%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#FF3E00" />
    </linearGradient>

    <!-- Inner Core Sparkle (High-Energy Specular Ridge) -->
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFFEC7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFC107" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Center Flare behind symbol -->
    <radialGradient id="ambientFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF334B" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#FF9E00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="anvilDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="boltEnergy" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#FFB703" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="10" stdDeviation="28" flood-color="#FF4500" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Standalone Squircle Base -->
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="none" stroke="url(#rimGrad)" stroke-width="4.5" />

  <!-- Ambient Energy Flare -->
  <circle cx="512" cy="512" r="440" fill="url(#ambientFlare)" />

  <!-- Main Symbol Group with Depth Filter -->
  <g filter="url(#anvilDepth)">

    <!--
      Precision Mask for Cutting Clean Clearance Gap around Lightning Bolt
    -->
    <mask id="boltCutout">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF" />
      <polygon points="
        610, 195
        535, 195
        400, 485
        550, 485
        410, 810
        650, 435
        500, 435
      " stroke="#000000" stroke-width="44" stroke-linejoin="miter" stroke-miterlimit="4" fill="#000000" />
    </mask>

    <!--
      The Classic Bold Heavy-Duty Anvil (Chiseled Tech Edges: Production-Ready Foundation)
    -->
    <g mask="url(#boltCutout)">
      <!-- Main Anvil Solid Body -->
      <path d="
        M 130 350
        L 320 325
        L 875 325
        L 875 415
        L 720 415
        L 660 480
        L 660 540
        L 710 610
        L 760 695
        L 594 695
        L 554 670
        L 470 670
        L 430 695
        L 264 695
        L 314 610
        L 364 540
        L 364 480
        L 304 415
        L 130 365
        Z
      " fill="url(#anvilRed)" stroke="url(#anvilBorder)" stroke-width="3" stroke-linejoin="round" />

      <!-- Top Face Plate Bevel Highlight -->
      <path d="
        M 130 350
        L 320 325
        L 875 325
        L 875 342
        L 315 342
        L 130 365
        Z
      " fill="url(#anvilTopHighlight)" />

      <!-- Chiseled Bottom Shadow Plate -->
      <polygon points="264, 695 314, 610 710, 610 760, 695" fill="#50030E" opacity="0.4" />
      <rect x="264" y="682" width="496" height="13" fill="#38020A" opacity="0.8" />
    </g>

    <!-- 
      The Iconic Bold Lightning Bolt (Fast Execution & AI Agent Energy)
    -->
    <g filter="url(#boltEnergy)">
      <!-- Bold Lightning Body -->
      <polygon points="
        610, 195
        535, 195
        400, 485
        550, 485
        410, 810
        650, 435
        500, 435
      " fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Inner Core Energy Facet (High-Energy Specular Ridge) -->
      <polygon points="
        595, 215
        545, 215
        425, 470
        535, 470
        432, 765
        630, 450
        515, 450
      " fill="url(#boltCore)" />
    </g>

  </g>
</svg>
