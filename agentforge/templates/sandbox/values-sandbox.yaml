# Lightweight values override for Developer Sandbox environment
global:
  environment: dev
  projectName: {{ project_name }}

backend:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    ENVIRONMENT: dev
    LOG_LEVEL: DEBUG
    CORS_ORIGINS: "*"

frontend:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: {{ ingress_class }}
  hosts:
    - host: {{ developer_name }}.sandbox.{{ domain_suffix }}
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

stateful:
  postgres:
    embedded: {{ embedded_postgres }}
  redis:
    embedded: {{ embedded_redis }}
