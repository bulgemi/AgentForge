apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ project_name }}-backend
  namespace: ai-agents
  labels:
    app: {{ project_name }}-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ project_name }}-backend
  template:
    metadata:
      labels:
        app: {{ project_name }}-backend
    spec:
      containers:
        - name: backend
          image: {{ project_name }}-backend:v1.0.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ project_name }}-backend
  namespace: ai-agents
spec:
  selector:
    app: {{ project_name }}-backend
  ports:
    - port: 8000
      targetPort: 8000
