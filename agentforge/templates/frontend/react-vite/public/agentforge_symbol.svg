<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Bold Flame Red Anvil Body (Balanced Rich Luminance & Depth) -->
    <linearGradient id="symAnvilRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="20%" stop-color="#F41834" />
      <stop offset="60%" stop-color="#C50F28" />
      <stop offset="100%" stop-color="#88081C" />
    </linearGradient>

    <!-- Anvil Top Face Plate Specular Highlight (Precision Machined Edge) -->
    <linearGradient id="symAnvilTopHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB3BF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FFD6DC" />
      <stop offset="100%" stop-color="#FF8596" />
    </linearGradient>

    <!-- Anvil Stroke Accent -->
    <linearGradient id="symAnvilBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD4" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FF4D6D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6E0515" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bold Electric Lightning Bolt Gradient (Hyper Gold & Vibrant Amber) -->
    <linearGradient id="symBoltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#FFF566" />
      <stop offset="40%" stop-color="#FFBA08" />
      <stop offset="75%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#FF3E00" />
    </linearGradient>

    <!-- Inner Core Sparkle (High-Energy Specular Ridge) -->
    <linearGradient id="symBoltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFFEC7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFC107" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="symAnvilDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="symBoltEnergy" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FFB703" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="8" stdDeviation="22" flood-color="#FF4500" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Main Symbol Group with Depth Filter -->
  <g filter="url(#symAnvilDepth)">

    <!-- Precision Mask for Cutting Clean Clearance Gap around Lightning Bolt -->
    <mask id="symBoltCutout">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF" />
      <polygon points="
        610, 195
        535, 195
        400, 485
        550, 485
        410, 810
        650, 435
        500, 435
      " stroke="#000000" stroke-width="44" stroke-linejoin="miter" stroke-miterlimit="4" fill="#000000" />
    </mask>

    <!-- The Classic Bold Heavy-Duty Anvil (Chiseled Tech Edges) -->
    <g mask="url(#symBoltCutout)">
      <!-- Main Anvil Solid Body -->
      <path d="
        M 130 350
        L 320 325
        L 875 325
        L 875 415
        L 720 415
        L 660 480
        L 660 540
        L 710 610
        L 760 695
        L 594 695
        L 554 670
        L 470 670
        L 430 695
        L 264 695
        L 314 610
        L 364 540
        L 364 480
        L 304 415
        L 130 365
        Z
      " fill="url(#symAnvilRed)" stroke="url(#symAnvilBorder)" stroke-width="3" stroke-linejoin="round" />

      <!-- Top Face Plate Bevel Highlight -->
      <path d="
        M 130 350
        L 320 325
        L 875 325
        L 875 342
        L 315 342
        L 130 365
        Z
      " fill="url(#symAnvilTopHighlight)" />

      <!-- Chiseled Bottom Shadow Plate -->
      <polygon points="264, 695 314, 610 710, 610 760, 695" fill="#50030E" opacity="0.4" />
      <rect x="264" y="682" width="496" height="13" fill="#38020A" opacity="0.8" />
    </g>

    <!-- The Iconic Bold Lightning Bolt (Bright Amber Gold) -->
    <g filter="url(#symBoltEnergy)">
      <!-- Bold Lightning Body -->
      <polygon points="
        610, 195
        535, 195
        400, 485
        550, 485
        410, 810
        650, 435
        500, 435
      " fill="url(#symBoltGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Inner Core Energy Facet -->
      <polygon points="
        595, 215
        545, 215
        425, 470
        535, 470
        432, 765
        630, 450
        515, 450
      " fill="url(#symBoltCore)" />
    </g>

  </g>
</svg>
